plugins {
    id "multiloader-common"
    id "net.neoforged.moddev"
}

// neoForge configuration is not required for a Forge-only build and
// can cause dependency resolution failures when a matching neoform
// artifact is not available for the target version. Commenting it out
// for now to allow the Forge build to proceed. Re-enable if you need
// neoForge-specific features or run the NeoForge subproject.
